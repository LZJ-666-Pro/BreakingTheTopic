# ============================================================
# 管理端（poti-admin）Nginx 配置
# 静态文件 + 反向代理到网关（172.18.0.1 = WSL 宿主机在 poti-net 中的地址）
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩，前端包比较大（1MB+）
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 后端接口：/api/xxx -> 网关 /xxx（网关按 /admin/** 转发到 poti-admin 服务）
    location /api/ {
        proxy_pass http://172.18.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 20m;
    }

    # 用户服务直连通道（Dashboard 里读取用户头像等用到）
    location /user-api/ {
        proxy_pass http://172.18.0.1:8200/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # ------------------------------------------------------------
    # 静态媒体资源：后端现在只存相对路径（/avatars/xxx.jpg），
    # 管理端页面必须把这些路径反代到后端，否则浏览器会去 3001 找而 404。
    # ------------------------------------------------------------
    # 用户头像 -> 网关 -> poti-user
    location /avatars/ {
        proxy_pass http://172.18.0.1:8080/avatars/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 聊天图片/语音 -> 网关 -> poti-user
    location /chat/images/ {
        proxy_pass http://172.18.0.1:8080/chat/images/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        expires 1d;
    }

    location /chat/voices/ {
        proxy_pass http://172.18.0.1:8080/chat/voices/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        expires 1d;
    }

    # 后台上传文件（管理端头像、文章配图等）-> poti-admin 服务自身静态目录
    location /uploads/ {
        proxy_pass http://172.18.0.1:8088/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        expires 1d;
    }

    # 单页应用路由回退：刷新任意路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
