server:
  port: 8200

jwt:
  secret: ${JWT_SECRET:poti2024secretkey1234567890abcdefghijklmnopqrstuvwxyz}
  expire: 86400000

poti:
  security:
    internal-token: ${INTERNAL_TOKEN:poti-internal-secret-2024}
    # 微信支付结果回调由微信服务器发起（无 JWT），需免鉴权；签名验证由回调逻辑自行完成
    # 注意：additional-exclude-paths 是增量白名单，与 common 默认白名单合并生效；
    # 不要改用 exclude-paths，那会整体覆盖默认白名单（曾导致 /avatars/** 等静态资源 401）
    additional-exclude-paths:
      - /vip/pay/notify

spring:
  application:
    name: poti-user
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  boot:
    admin:
      client:
        enabled: true
        url: http://localhost:8888
        instance:
          service-host-type: ip
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/poti_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD:123456}
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            minimum-idle: 5
            maximum-pool-size: 20
            connection-timeout: 30000
            idle-timeout: 600000
            max-lifetime: 1800000
            connection-test-query: SELECT 1
        search:
          url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/poti-search?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD:123456}
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            minimum-idle: 2
            maximum-pool-size: 10
            connection-timeout: 30000
        # 后台系统配置库（sys_config 行为开关：开放注册/讨论区等）
        admin:
          url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/poti_admin?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD:123456}
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            minimum-idle: 2
            maximum-pool-size: 10
            connection-timeout: 30000
            idle-timeout: 600000
            max-lifetime: 1800000
            connection-test-query: SELECT 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 3000
    lettuce:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

avatar:
  upload:
    path: ./uploads/avatars/
  url:
    prefix: ${AVATAR_URL_PREFIX:http://10.16.145.198:8200/avatars/}

wx:
  appid: ${WX_APPID:wx920f3d57f4121af7}
  secret: ${WX_SECRET:1a1df381bfb417d942beee26ef809b09}
  pay:
    # 微信支付总开关：false 或商户参数不全时自动降级为模拟支付（点击支付即成功）
    enabled: ${WX_PAY_ENABLED:false}
    # 商户号
    mch-id: ${WX_PAY_MCH_ID:}
    # 商户 API 证书序列号（商户平台-API安全-API证书管理）
    mch-serial-no: ${WX_PAY_SERIAL_NO:}
    # APIv3 密钥（商户平台-账户中心-API安全-APIv3密钥，32位）
    api-v3-key: ${WX_PAY_APIV3_KEY:}
    # 商户私钥文件 apiclient_key.pem 的本地绝对路径
    private-key-path: ${WX_PAY_PRIVATE_KEY_PATH:}
    # 支付结果回调地址（必须公网 https，微信服务器需能直接访问；本地开发可用内网穿透）
    notify-url: ${WX_PAY_NOTIFY_URL:}

sms:
  spug:
    template-id: My5R7m0dKomV2DgG
    app-name: 破题刷题
  verify:
    code:
      expire: 300
      cooldown: 60
      max-per-day: 10
  dev:
    # 本地开发未配置模板时打印验证码明文（仅限本机；生产环境严禁开启）
    log-code: true

management:
  health:
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.poti.user: INFO
