server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:poti2024secretkey1234567890abcdefghijklmnopqrstuvwxyz}
  expire: 86400000

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  boot:
    admin:
      client:
        enabled: true
        url: http://localhost:8888
        instance:
          service-host-type: ip
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      httpclient:
        connect-timeout: 10000
        response-timeout: 600s
      routes:

        - id: poti-user
          uri: lb://poti-user
          predicates:
            - Path=/user/**

        - id: poti-feedback
          uri: lb://poti-user
          predicates:
            - Path=/feedback/**

        - id: poti-sms
          uri: lb://poti-user
          predicates:
            - Path=/sms/**

        # 好友关系（FriendshipController，位于 poti-user）
        - id: poti-friendship
          uri: lb://poti-user
          predicates:
            - Path=/friendship/**

        # 会员/VIP（VipController，位于 poti-user）
        - id: poti-vip
          uri: lb://poti-user
          predicates:
            - Path=/vip/**

        # 系统配置（SystemConfigController：联系方式、群配置等，位于 poti-user）
        - id: poti-config
          uri: lb://poti-user
          predicates:
            - Path=/config/**


        - id: poti-auth
          uri: lb://poti-auth
          predicates:
            - Path=/auth/**


        - id: poti-question
          uri: lb://poti-question
          predicates:
            - Path=/question/**


        - id: poti-practice
          uri: lb://poti-practice
          predicates:
            - Path=/practice/**

        # 竞赛（CompetitionController，位于 poti-practice）
        - id: poti-competition
          uri: lb://poti-practice
          predicates:
            - Path=/competition/**


        - id: poti-wrongbook
          uri: lb://poti-wrongbook
          predicates:
            - Path=/wrongbook/**


        - id: poti-favorite
          uri: lb://poti-favorite
          predicates:
            - Path=/favorite/**


        - id: poti-interview
          uri: lb://poti-interview
          predicates:
            - Path=/interview/**

        # 面试训练营 CampController：前端 /camp/list、/camp/detail、/camp/join、/camp/checkin
        - id: poti-camp
          uri: lb://poti-interview
          predicates:
            - Path=/camp/**


        - id: poti-search
          uri: lb://poti-search
          predicates:
            - Path=/search/**


        - id: poti-monitor
          uri: lb://poti-monitor
          predicates:
            - Path=/monitor/**
          filters:
            - StripPrefix=1

        - id: poti-admin
          uri: lb://poti-admin
          predicates:
            - Path=/admin/**

        - id: poti-discussion
          uri: lb://poti-user
          predicates:
            - Path=/discussion/**

        - id: poti-checkin
          uri: lb://poti-user
          predicates:
            - Path=/checkin/**

        # —— 内网穿透收敛路由：小程序/管理端全部流量经 gateway 单入口 ——
        - id: poti-agent
          uri: lb://poti-agent
          predicates:
            - Path=/agent/**

        # 头像/聊天媒体静态资源（poti-user 内部 WebMvcConfig 映射）
        - id: poti-avatar-static
          uri: lb://poti-user
          predicates:
            - Path=/avatars/**

        - id: poti-chat-media
          uri: lb://poti-user
          predicates:
            - Path=/chat/**

        # 管理端 axios baseURL=/api，admin 服务接口本身无 /api 前缀，需剥离
        - id: poti-admin-api
          uri: lb://poti-admin
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1


management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.poti.gateway: INFO
